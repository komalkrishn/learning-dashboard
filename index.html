<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><meta name="description" content="A personal JavaScript, React, Next.js and Node.js interview practice studio."/><title>Devroom · Interview Studio</title><link rel="icon" href="./favicon.svg"/><script>try{const saved=localStorage.getItem('devroom:theme');const theme=saved==='dark'||saved==='light'?saved:(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.dataset.theme=theme;document.documentElement.classList.toggle('dark',theme==='dark');}catch{document.documentElement.dataset.theme='light';}</script></head><body><div id="root"></div><script type="module" src="/main.tsx"></script></body></html>
